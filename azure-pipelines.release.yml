pr: none
trigger: none

# Customize build number to include major version
# Example: v8_20201022.1
name: 'v8_$(Date:yyyyMMdd)$(Rev:.r)'

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: false

variables:
  - template: .devops/templates/variables.yml
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: OfficePipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need windows because compliance task only run on windows.
    settings:
      networkIsolationPolicy: AzureActiveDirectory,AzureKeyVault,AzureResourceManager,AzureStorage,GitHub
    stages:
      - stage: build
        displayName: Build artifacts
        jobs:
          - job: build
            displayName: Build, test, pack
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            timeoutInMinutes: 90
            workspace:
              clean: all
            variables:
              - template: .devops/templates/release-build-variables.yml@self
            templateContext:
              outputParentDirectory: $(Build.StagingDirectory)
              outputs:
                - output: pipelineArtifact
                  artifactName: ${{ variables.packagesArtifactName }}
                  path: $(packagesArtifactPath)
                - output: pipelineArtifact
                  artifactName: ${{ variables.releaseToolArtifactName }}
                  path: $(releaseToolArtifactPath)
                - output: pipelineArtifact
                  targetPath: $(Build.StagingDirectory)/homepage
                  artifactName: homepage.htm
                  displayName: homepage.htm
                - output: pipelineArtifact
                  targetPath: $(Build.StagingDirectory)/site-manifests
                  artifactName: site-manifests
                  displayName: site-manifests
                - output: pipelineArtifact
                  targetPath: $(Build.StagingDirectory)/fabric-website
                  artifactName: fabric-website
                  displayName: fabric-website
            steps:
              - template: .devops/templates/release-setup.yml@self
                parameters:
                  dryRun: ${{ parameters.dryRun }}

              - template: .devops/templates/prepare-release-artifacts.yml@self

              - script: |
                  yarn generate-version-files
                displayName: Generate version files

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t build -p tag:v8 --exclude tag:vNext,tag:tools,ssr-tests,vr-tests,perf-test --nxBail
                displayName: build

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t test -p tag:v8 --exclude tag:vNext,tag:tools,ssr-tests,vr-tests,perf-test --nxBail
                displayName: test

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t lint -p tag:v8 --exclude tag:vNext,tag:tools,ssr-tests,vr-tests,perf-test --nxBail
                displayName: lint

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t bundle -p tag:v8 --exclude tag:vNext,tag:tools,ssr-tests,vr-tests,perf-test --nxBail
                displayName: bundle

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t verify-packaging -p tag:v8 --exclude tag:vNext,tag:tools,ssr-tests,vr-tests,perf-test --nxBail
                displayName: verify packaged assets

              - script: |
                  mkdir -p '$(packagesArtifactPath)'
                  yarn beachball publish --no-push --pack-to-path '$(packagesArtifactPath)' --config scripts/beachball/src/release-v8.config.js --message 'release: applying package updates - react v8'
                condition: and(succeeded(), not(${{ parameters.dryRun }}))
                displayName: Pack packages

              - script: |
                  echo Making $(Build.ArtifactStagingDirectory)/api
                  mkdir -p $(Build.ArtifactStagingDirectory)/api
                  cp packages/*/dist/*.api.json $(Build.ArtifactStagingDirectory)/api
                displayName: Copy api.json files to artifact staging directory

              - script: |
                  oufrVersion=$(node -p -e "require('./packages/react/package.json').version")
                  echo "OUFR Version: $oufrVersion"
                  echo $oufrVersion > oufr-version.txt
                  echo "##vso[task.setvariable variable=oufrVersion;]$oufrVersion"
                displayName: 'Set oufrVersion variable'

              # create-site-manifests is a script defined in @fluentui/public-docsite-setup.
              # It generates manifest files used to load the current version on developer.microsoft.com/fluentui.
              - script: |
                  yarn create-site-manifests ./packages/react
                displayName: 'Generate website manifests'

              # Generate the homepage.htm file used to load developer.microsoft.com/fluentui. Note that the
              # generated file must be manually checked in to an internal repo, it's just generated as a build
              # artifact for convenience and tracking.
              - script: |
                  node ./packages/public-docsite-setup/scripts/generateHomepage '$(Build.StagingDirectory)/homepage'
                displayName: 'Generate homepage.htm'

              - script: |
                  cp -R '$(System.DefaultWorkingDirectory)/apps/public-docsite/dist' '$(Build.StagingDirectory)/fabric-website'
                  cp -R '$(System.DefaultWorkingDirectory)/site-manifests' '$(Build.StagingDirectory)/site-manifests'
                displayName: Copy website artifacts to staging directory

      - template: .devops/templates/release-stage.yml@self
        parameters:
          dryRun: ${{ parameters.dryRun }}
          productName: fluentui-react-v8
          additionalArtifacts:
            - artifactName: fabric-website
              targetPath: $(System.DefaultWorkingDirectory)/fabric-website
            - artifactName: site-manifests
              targetPath: $(System.DefaultWorkingDirectory)/site-manifests
          additionalSteps:
            - template: .devops/templates/publish-website.yml@self

      - template: .devops/templates/push-stage.yml@self
        parameters:
          dryRun: ${{ parameters.dryRun }}
          buildCommand: |
            FLUENT_PROD_BUILD=true yarn nx run-many -t build -p tag:v8 --exclude tag:vNext,tag:tools,ssr-tests,vr-tests,perf-test --nxBail
          beachballConfig: scripts/beachball/src/release-v8.config.js
          message: 'release: applying package updates - react v8'
          postPushCommand: node -r ./scripts/ts-node/src/register ./scripts/update-release-notes/src/index.ts --token=$(createToken.GITHUB_APP_TOKEN) --apply --debug
