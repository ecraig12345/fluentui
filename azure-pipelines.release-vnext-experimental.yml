pr: none
trigger: none

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: true

# Customize build number to include major version
# Example: v9_20201022.1
name: 'v9_experimental_$(Date:yyyyMMdd)$(Rev:.r)'

variables:
  - group: 'Github and NPM secrets'
  - template: .devops/templates/variables.yml
  - name: release.vnext # Used to scope beachball to release only vnext packages
    value: true
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need windows because compliance task only run on windows.
    stages:
      - template: .devops/templates/release-experimental.yml@self
        parameters:
          dryRun: ${{ parameters.dryRun }}
          baseVersionPackage: packages/react-components/react-components/package.json
          beachballConfig: scripts/beachball/src/release-vNext.config.js
          label: v9 experimental
          nxScope: -p 'tag:vNext' --exclude 'tag:npm:private,tag:tools,tag:charting,tag:react-headless'
          versionBumpArgs: --all
