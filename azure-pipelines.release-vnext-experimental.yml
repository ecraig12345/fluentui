pr: none
trigger: none

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: true

# Customize build number to include major version
# Example: v9_20201022.1
name: 'v9_experimental_$(Date:yyyyMMdd)$(Rev:.r)'

variables:
  - template: .devops/templates/variables.yml
  - name: release.vnext # Used to scope beachball to release only vnext packages
    value: true
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: OfficePipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need windows because compliance task only run on windows.
    settings:
      networkIsolationPolicy: AzureActiveDirectory,AzureKeyVault,AzureResourceManager,AzureStorage,GitHub
    stages:
      - stage: build
        displayName: Build artifacts
        jobs:
          - job: build
            displayName: Build, test, pack
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            workspace:
              clean: all
            variables:
              - template: .devops/templates/release-build-variables.yml@self
            templateContext:
              outputParentDirectory: $(Build.StagingDirectory)
              outputs:
                - output: pipelineArtifact
                  artifactName: ${{ variables.packagesArtifactName }}
                  path: $(packagesArtifactPath)
                - output: pipelineArtifact
                  artifactName: ${{ variables.releaseToolArtifactName }}
                  path: $(releaseToolArtifactPath)
            steps:
              - template: .devops/templates/release-setup.yml@self
                parameters:
                  dryRun: ${{ parameters.dryRun }}

              - template: .devops/templates/prepare-release-artifacts.yml@self

              - task: Bash@3
                name: validation
                inputs:
                  targetType: 'inline'
                  script: |
                    BRANCH="$(Build.SourceBranch)"
                    if [[ ! $BRANCH =~ refs/heads/experimental/ ]]; then
                      echo "##vso[task.logissue type=error]Branch '$BRANCH' must start with 'refs/heads/experimental/'"
                      exit 1
                    fi
                    BRANCH_PATH=${BRANCH#refs/heads/}
                    FEATURE_NAME=${BRANCH#refs/heads/experimental/}
                    echo "##vso[task.setvariable variable=branchPath;isOutput=true]$BRANCH_PATH"
                    echo "##vso[task.setvariable variable=featureName;isOutput=true]$FEATURE_NAME"
                    echo "Branch path: $BRANCH_PATH"
                    echo "Feature name: $FEATURE_NAME"
                displayName: Validate branch and extract feature name

                # Deletes all existing changefiles so that only bump that happens is for nightly
              - script: |
                  rm -f change/*
                displayName: 'Delete existing changefiles'

                # Bumps all v9 packages to a x.x.x-experimental.<feature>.<date>-<hash> version and checks in change files
                # x.x.x is derived from the current version @fluentui/react-components package.json
              - script: |
                  FEATURE_NAME=$(validation.featureName)
                  BASE_VERSION=$(node -p "require('./packages/react-components/react-components/package.json').version")
                  DATE=$(date +"%Y%m%d")
                  HASH=$(git rev-parse --short HEAD)
                  NEW_VERSION="${BASE_VERSION}-experimental.${FEATURE_NAME}.${DATE}-${HASH}"

                  echo "Target version: ${NEW_VERSION}"

                  yarn nx g @fluentui/workspace-plugin:version-bump --all --explicitVersion "${NEW_VERSION}"
                  git add .
                  git commit -m "bump experimental versions to ${NEW_VERSION}"
                  yarn change --type prerelease --message "Release ${NEW_VERSION}" --dependent-change-type "prerelease"
                displayName: 'Bump and commit experimental versions'

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t build -p "tag:vNext"  --exclude "tag:npm:private,tag:tools,tag:charting,tag:react-headless" --nxBail
                displayName: build

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t lint -p "tag:vNext"  --exclude "tag:npm:private,tag:tools,tag:charting,tag:react-headless" --nxBail
                displayName: lint

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t test -p "tag:vNext"  --exclude "tag:npm:private,tag:tools,tag:charting,tag:react-headless" --nxBail
                displayName: test

              - script: |
                  mkdir -p '$(packagesArtifactPath)'
                  yarn beachball publish \
                    -b origin/$(validation.branchPath) \
                    --no-push \
                    --pack-to-path '$(packagesArtifactPath)' \
                    --tag experimental \
                    --config scripts/beachball/src/release-vNext.config.js
                displayName: Pack packages
                condition: and(succeeded(), not(${{ parameters.dryRun }}))

      - template: .devops/templates/release-stage.yml@self
        parameters:
          dryRun: ${{ parameters.dryRun }}
          productName: fluentui-react-components-experimental
          npmTag: experimental
