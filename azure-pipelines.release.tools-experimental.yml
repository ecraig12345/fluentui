pr: none
trigger: none

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: true

# Customize build number to include tools experimental prefix
# Example: tools_experimental_20201022.1
name: 'tools_experimental_$(Date:yyyyMMdd)$(Rev:.r)'

variables:
  - group: 'Github and NPM secrets'
  - template: .devops/templates/variables.yml
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need windows because compliance task only run on windows.
    stages:
      - template: .devops/templates/release-experimental.yml@self
        parameters:
          dryRun: ${{ parameters.dryRun }}
          beachballConfig: scripts/beachball/src/release-tools.config.js
          label: tools experimental
          nxScope: -p 'tag:tools,!tag:npm:private,!tag:v8' --exclude 'apps/**'
          versionBumpArgs: --all --scope tools
