pr: none

trigger: none

name: '$(targetNpmVersion) ($(Rev:r))'

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: false

variables:
  - template: .devops/templates/variables.yml
  - name: skipComponentGovernanceDetection
    value: true
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: OfficePipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need windows because compliance task only run on windows.
    settings:
      networkIsolationPolicy: AzureActiveDirectory,AzureKeyVault,AzureResourceManager,AzureStorage,GitHub
    stages:
      - stage: build
        displayName: Build artifacts
        jobs:
          - job: build
            displayName: Build and pack
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            workspace:
              clean: all
            templateContext:
              outputParentDirectory: $(Build.StagingDirectory)
              outputs:
                - output: pipelineArtifact
                  artifactName: ${{ variables.packagesArtifactName }}
                  path: $(packagesArtifactPath)
                - output: pipelineArtifact
                  artifactName: ${{ variables.releaseToolArtifactName }}
                  path: $(releaseToolArtifactPath)
            variables:
              - template: .devops/templates/release-build-variables.yml@self
            steps:
              - bash: |
                  if [[ -z "$(targetNpmVersion)" ]]; then
                    echo "##vso[task.logissue type=error]targetNpmVersion is not specified"
                    exit 1
                  fi
                displayName: Check targetNpmVersion is specified

              - template: .devops/templates/release-setup.yml@self
                parameters:
                  dryRun: ${{ parameters.dryRun }}

              - template: .devops/templates/prepare-release-artifacts.yml@self

              - script: |
                  node -e "let semver = require('semver');if(!semver.valid('$(targetNpmVersion)')){ throw new Error('Invalid version specified'); }"
                displayName: 'Check targetNpmVersion is valid semver'

              - script: |
                  npm version $(targetNpmVersion)
                workingDirectory: 'packages/react'
                displayName: 'Manually set package version'

              - script: |
                  yarn nx run react:build --production
                displayName: yarn build to FUIR (Create production build)

              - script: yarn workspace @fluentui/react bundle --production
                displayName: yarn bundle FUIR

              - script: |
                  mkdir -p '$(packagesArtifactPath)/1'
                  npm pack --pack-destination '$(packagesArtifactPath)/1'
                displayName: 'Create tarball'
                workingDirectory: 'packages/react'

      - template: .devops/templates/release-stage.yml@self
        parameters:
          dryRun: ${{ parameters.dryRun }}
          productName: fluentui-react-v8-hotfix
          npmTag: hf8
