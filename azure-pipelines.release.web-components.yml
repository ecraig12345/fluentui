pr: none
trigger: none

# Customize build number to include major version
# Example: web-components_20201022.1
name: 'web-components_$(Date:yyyyMMdd)$(Rev:.r)'

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: false

variables:
  - template: .devops/templates/variables.yml
  - name: release.web_components # Used to scope beachball to release only vnext packages
    value: true
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: OfficePipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release

schedules:
  # Triggers the nightly release
  # minute 0, hour 4 in UTC (5am in UTC+1), any day of month, any month, days 1-5 of week (M-F)
  # https://docs.microsoft.com/en-us/azure/devops/pipelines/build/triggers?tabs=yaml&view=azure-devops#supported-cron-syntax
  - cron: '0 4 * * 1-5'
    displayName: 'Daily release (M-F at 5am UTC+1)'
    branches:
      include:
        - master

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need windows because compliance task only run on windows.
    settings:
      networkIsolationPolicy: AzureActiveDirectory,AzureKeyVault,AzureResourceManager,AzureStorage,GitHub
    stages:
      - stage: build
        displayName: Build artifacts
        jobs:
          - job: build
            displayName: Build, test, pack
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            workspace:
              clean: all
            variables:
              - template: .devops/templates/release-build-variables.yml@self
            templateContext:
              outputParentDirectory: $(Build.StagingDirectory)
              outputs:
                - output: pipelineArtifact
                  artifactName: ${{ variables.packagesArtifactName }}
                  path: $(packagesArtifactPath)
                - output: pipelineArtifact
                  artifactName: ${{ variables.releaseToolArtifactName }}
                  path: $(releaseToolArtifactPath)
            steps:
              - template: .devops/templates/release-setup.yml@self
                parameters:
                  dryRun: ${{ parameters.dryRun }}

              - template: .devops/templates/prepare-release-artifacts.yml@self

              - script: |
                  yarn nx run-many -t format:check lint test build -p tag:web-components --exclude vr-tests-web-components --nxBail
                displayName: Build, Test, Lint

              - script: |
                  mkdir -p '$(packagesArtifactPath)'
                  yarn beachball publish --no-push --pack-to-path '$(packagesArtifactPath)' --config scripts/beachball/src/release-web-components.config.js --message 'release: applying package updates - web-components'
                displayName: Pack packages
                condition: not(${{ parameters.dryRun }})

      - template: .devops/templates/release-stage.yml@self
        parameters:
          dryRun: ${{ parameters.dryRun }}
          productName: fluentui-web-components

      - template: .devops/templates/push-stage.yml@self
        parameters:
          dryRun: ${{ parameters.dryRun }}
          buildCommand: yarn nx run-many -t build -p tag:web-components --exclude vr-tests-web-components --nxBail
          beachballConfig: scripts/beachball/src/release-web-components.config.js
          message: 'release: applying package updates - web-components'
