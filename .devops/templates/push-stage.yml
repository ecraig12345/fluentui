parameters:
  - name: dryRun
    type: boolean
  - name: buildCommand
    type: string
  - name: beachballConfig
    type: string
  - name: message
    type: string
  - name: postPushCommand
    type: string
    default: ''

stages:
  - stage: push
    displayName: Push to git
    dependsOn: publish
    jobs:
      - job: push
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: ubuntu-latest
          os: linux
        steps:
          - template: release-setup.yml
            parameters:
              dryRun: ${{ parameters.dryRun }}

          - script: ${{ parameters.buildCommand }}
            displayName: Build

          - task: AzureCLI@2
            name: createToken
            displayName: Create GitHub App token
            inputs:
              azureSubscription: ogx-oss-release-bot
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                yarn beachball-auth-helper create-github-app-token \
                  --app-client-id Iv23ligBoU5jc9SIFnGR \
                  --key-id https://ogx-oss-release-keyvault.vault.azure.net/keys/office-ogx-auth-helper-key \
                  --repository $(Build.Repository.Name) \
                  --permissions contents:write \
                  --ci-output-name GITHUB_APP_TOKEN

          - script: yarn beachball publish --no-publish --config ${{ parameters.beachballConfig }} --message '${{ parameters.message }}'
            displayName: Push package updates
            env:
              BEACHBALL_GIT_TOKEN: $(createToken.GITHUB_APP_TOKEN)

          - ${{ if ne(parameters.postPushCommand, '') }}:
              - script: ${{ parameters.postPushCommand }}
                displayName: Update npm package metadata
                continueOnError: true
                env:
                  NPM_TOKEN: $(npmToken)

          - script: yarn beachball-auth-helper revoke-github-app-token
            displayName: Revoke GitHub App token
            condition: and(always(), ne(variables['createToken.GITHUB_APP_TOKEN'], ''))
            env:
              TOKEN: $(createToken.GITHUB_APP_TOKEN)
