steps:
  - task: AzureCLI@2
    displayName: 'Copy website drop to Azure'
    inputs:
      azureSubscription: 'Azure - fabricweb storage - NEW'
      scriptType: 'bash'
      scriptLocation: inlineScript
      inlineScript: |
        az storage blob upload-batch \
        --destination 'fabric-website' \
        --source $(System.DefaultWorkingDirectory)/fabric-website \
        --account-name fabricweb \
        --destination-path v8/$(Build.BuildNumber)/ \
        --auth-mode login \
        --overwrite

  - task: AzureCLI@2
    displayName: 'Update dogfood manifest in Azure blob'
    inputs:
      azureSubscription: 'Azure - fabricweb storage - NEW'
      scriptType: 'bash'
      scriptLocation: inlineScript
      inlineScript: |
        az storage blob upload \
        --account-name fabricweb \
        --container-name fabric-website \
        --name manifests/v8-df.js \
        --file $(System.DefaultWorkingDirectory)/site-manifests/v8-df.js \
        --auth-mode login \
        --overwrite

  - task: AzureCLI@2
    displayName: 'Update prod manifest in Azure blob'
    inputs:
      azureSubscription: 'Azure - fabricweb storage - NEW'
      scriptType: 'bash'
      scriptLocation: inlineScript
      inlineScript: |
        az storage blob upload \
        --account-name fabricweb \
        --container-name fabric-website \
        --name manifests/v8-prod.js \
        --file $(System.DefaultWorkingDirectory)/site-manifests/v8-prod.js \
        --auth-mode login \
        --overwrite
