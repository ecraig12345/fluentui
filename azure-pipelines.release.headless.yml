pr: none
trigger: none

# Customize build number to include package prefix
# Example: headless_20201022.1
name: 'headless_$(Date:yyyyMMdd)$(Rev:.r)'

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: false

variables:
  - group: 'Github and NPM secrets'
  - template: .devops/templates/variables.yml
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need windows because compliance task only run on windows.
    stages:
      - template: .devops/templates/release.yml@self
        parameters:
          dryRun: ${{ parameters.dryRun }}
          beachballConfig: scripts/beachball/src/release-headless.config.js
          label: react-headless
          nxScope: -p 'tag:react-headless,!tag:npm:private,!tag:type:stories' --exclude 'apps/**'
