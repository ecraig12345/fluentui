pr: none
trigger: none

# Customize build number to include package prefix
# Example: headless_20201022.1
name: 'headless_$(Date:yyyyMMdd)$(Rev:.r)'

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: false

variables:
  - template: .devops/templates/variables.yml
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: OfficePipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need windows because compliance task only run on windows.
    settings:
      networkIsolationPolicy: AzureActiveDirectory,AzureKeyVault,AzureResourceManager,AzureStorage,GitHub
    stages:
      - stage: build
        displayName: Build artifacts
        jobs:
          - job: build
            displayName: Build, test, pack
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            timeoutInMinutes: 90
            workspace:
              clean: all
            variables:
              - template: .devops/templates/release-build-variables.yml@self
            templateContext:
              outputParentDirectory: $(Build.StagingDirectory)
              outputs:
                - output: pipelineArtifact
                  artifactName: ${{ variables.packagesArtifactName }}
                  path: $(packagesArtifactPath)
                - output: pipelineArtifact
                  artifactName: ${{ variables.releaseToolArtifactName }}
                  path: $(releaseToolArtifactPath)
            steps:
              - template: .devops/templates/release-setup.yml@self
                parameters:
                  dryRun: ${{ parameters.dryRun }}

              - template: .devops/templates/prepare-release-artifacts.yml@self

              - script: |
                  echo "Following packages will be published (if they contain changes):"
                  yarn nx show projects -p 'tag:react-headless,!tag:npm:private' --exclude 'apps/**'
                displayName: Show packages

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t build -p 'tag:react-headless,!tag:npm:private,!tag:type:stories' --exclude 'apps/**' --nxBail
                displayName: build

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t test -p 'tag:react-headless,!tag:npm:private,!tag:type:stories' --exclude 'apps/**' --nxBail
                displayName: test

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t lint -p 'tag:react-headless,!tag:npm:private,!tag:type:stories' --exclude 'apps/**' --nxBail
                displayName: lint

              - script: |
                  mkdir -p '$(packagesArtifactPath)'
                  yarn beachball publish --no-push --pack-to-path '$(packagesArtifactPath)' --config scripts/beachball/src/release-headless.config.js --message 'release: applying package updates - react-headless'
                displayName: Pack packages
                condition: not(${{ parameters.dryRun }})

      - template: .devops/templates/release-stage.yml@self
        parameters:
          dryRun: ${{ parameters.dryRun }}
          productName: fluentui-react-headless

      - template: .devops/templates/push-stage.yml@self
        parameters:
          dryRun: ${{ parameters.dryRun }}
          buildCommand: FLUENT_PROD_BUILD=true yarn nx run-many -t build -p 'tag:react-headless,!tag:npm:private,!tag:type:stories' --exclude 'apps/**' --nxBail
          beachballConfig: scripts/beachball/src/release-headless.config.js
          message: 'release: applying package updates - react-headless'
